# Temporary: builds the site exactly like GitHub Pages does and lists what
# would be published. Removed again after the check.
name: Pages-Probe
on:
  push:
    branches: [livegang-vorbereitung]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Was würde veröffentlicht?
        run: |
          cd _site
          find . -type f | sort
          leak=0
          for f in $(find . -type f \( -name '*.md' -o -name '*.mjs' -o -name '_config.yml' \)) LIVEGANG.html CLAUDE.html fuer-sophie brand_assets/hibiscus_pink.jpg brand_assets/leo_fur.jpg .github; do
            if [ -e "$f" ]; then echo "LEAK: $f"; leak=1; fi
          done
          for f in index.html impressum.html datenschutz.html widerruf.html 404.html css/style.css js/main.js fonts/OFL.txt fonts/fonts.css favicon.ico favicon.svg site.webmanifest icon-512.png robots.txt sitemap.xml share.jpg apple-touch-icon.png brand_assets/sets/tortoise-gold.webp; do
            [ -e "$f" ] || { echo "MISSING: $f"; leak=1; }
          done
          for f in index.html impressum.html datenschutz.html widerruf.html 404.html css/style.css js/main.js sitemap.xml robots.txt; do
            cmp -s "$f" "../$f" && echo "unchanged: $f" || { echo "CHANGED BY JEKYLL: $f"; leak=1; }
          done
          exit $leak
